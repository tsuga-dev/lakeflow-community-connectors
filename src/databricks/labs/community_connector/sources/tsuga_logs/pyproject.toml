[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-tsuga-logs"
version = "0.2.5"
description = "Tsuga logs connector for Lakeflow Community Connectors"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "pydantic>=2.0.0",
    "requests>=2.32.0",
    "lakeflow-community-connectors>=0.1.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["databricks.labs.community_connector.sources.tsuga_logs"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.tsuga_logs" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
